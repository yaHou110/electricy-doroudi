name: electricy-doroudi

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: electricy-doroudi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d electricy-doroudi"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - electricy-doroudi-postgres:/var/lib/postgresql/data

volumes:
  electricy-doroudi-postgres:
